[project]
name = "mb-audit"
version = "0.1.0"
description = "Audit a Micro.blog site against BAR backup files"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jamie Thingelstad" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "selectolax>=0.3.21",
]

[project.scripts]
mb-audit = "mb_audit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mb_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/mb_audit"]
