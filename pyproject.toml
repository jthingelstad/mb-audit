[project]
name = "mb-audit"
version = "0.1.0"
description = "Audit a Micro.blog site against BAR backup files"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jamie Thingelstad" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "selectolax>=0.3.21",
]

[project.scripts]
mb-audit = "mb_audit.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0,<8",
    "mypy>=1.10",
    "ruff>=0.15.22,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mb_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/mb_audit"]
